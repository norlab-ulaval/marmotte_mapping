input:
  - BoundingBoxDataPointsFilter:
      xMin: -0.5
      xMax: 0.5
      yMin: -0.5
      yMax: 0.5
      zMin: -0.5
      zMax: 0.5
      removeInside: 1

  # - BoundingBoxDataPointsFilter:
  #     xMin: 2.0
  #     xMax: 10.0
  #     yMin: -0.5
  #     yMax: 0.5
  #     zMin: -0.3
  #     zMax: 1.3
  #     removeInside: 1

  # - BoundingBoxDataPointsFilter:
  #     xMin: -1.0
  #     xMax: 1.0
  #     yMin: -2.5
  #     yMax: 2.5
  #     zMin: -0.5
  #     zMax: 2.5
  #     removeInside: 1

  - RandomSamplingDataPointsFilter:
      prob: 0.8

  - ObservationDirectionDataPointsFilter:

  # - AddDescriptorDataPointsFilter:
  #     descriptorName: probabilityDynamic 
  #     descriptorDimension: 1
  #     descriptorValues: [0.6] # This value is the initial probability of each point being dynamic

icp:
  matcher:
    KDTreeMatcher:
      knn: 6
      maxDist: 1.0
      epsilon: 1

  outlierFilters:
    - TrimmedDistOutlierFilter:
        ratio: 0.7

  errorMinimizer:
    PointToPlaneWithAltitudeErrorMinimizer:
          force4DOF: 1
          forceAltitude: 1

  transformationCheckers:
    - DifferentialTransformationChecker:
        minDiffRotErr: 0.001
        minDiffTransErr: 0.01
        smoothLength: 2
    - CounterTransformationChecker:
        maxIterationCount: 40
    - BoundTransformationChecker:
        maxRotationNorm: 6.1
        maxTranslationNorm: 5.00

  inspector:
    NullInspector

  logger:
    NullLogger


post:
  # - CutAtDescriptorThresholdDataPointsFilter:
  #     descName: probabilityDynamic
  #     useLargerThan: 1
  #     threshold: 0.75

  - SurfaceNormalDataPointsFilter:
      knn: 10


mapper:
  updateCondition:
    type: delay
    value: 0.0

  mapperModule:
    # - DynamicPointsMapperModule:
    #     thresholdDynamic: 0.75
    #     alpha: 0.8
    #     beta: 0.99
    #     beamHalfAngle: 0.017453292
    #     epsilonA: 0.01
    #     epsilonD: 0.01

    - PointDistanceMapperModule:
        minDistNewPoint: 0.05

  sensorMaxRange: 100.0